<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Operations Console</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 980px; margin: 32px auto; padding: 0 20px; color: #202124; }
      button { margin: 4px; padding: 8px 12px; cursor: pointer; border: 1px solid #adb5bd; border-radius: 5px; background: white; }
      button:hover { background: #e7f5ff; }
      pre { background: #f1f3f5; padding: 16px; min-height: 80px; white-space: pre-wrap; overflow: auto; }
      .scenario, .incident { border: 1px solid #dee2e6; border-radius: 8px; padding: 14px; margin: 12px 0; }
      .incident h3 { margin: 0 0 8px; }
      .meta { color: #495057; font-size: 0.9rem; }
      .active { border-left: 5px solid #e03131; }
      .resolved { border-left: 5px solid #2f9e44; }
      .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #ffe3e3; margin-right: 6px; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <h1>Operations Console</h1>
    <p>Generate a controlled failure, refresh the candidates, then diagnose and resolve the active incident.</p>
    <button data-path="/health">Health</button>
    <button data-path="/api/hello">Normal response</button>
    <button data-path="/api/db-check">Database check</button>
    <button data-path="/api/items">Database query</button>
    <button data-path="/api/error">HTTP 500 error</button>
    <button data-path="/api/delay?seconds=5">5-second delay</button>
    <button data-path="/api/cpu?seconds=10">10-second CPU load</button>
    <pre id="output">Choose an action.</pre>
    <div class="scenario">
      <h2>Controlled incident scenarios</h2>
      <button id="cause-pool">Cause DB pool exhaustion</button>
      <button id="cause-lock">Cause DB lock contention</button>
      <button id="cause-retry">Cause dependency retry storm</button>
      <button id="reset-demo">Fix/reset demo scenarios</button>
      <pre id="scenario-output">No scenario running.</pre>
    </div>
    <h2>Incident console</h2>
    <button id="refresh-incidents">Refresh incidents</button>
    <button id="diagnose-incident">Diagnose active incident</button>
    <button id="resolve-incident" class="hidden">Resolve diagnosed incident</button>
    <button id="cancel-diagnosis" class="hidden">Cancel diagnosis</button>
    <button id="clear-memory">Clear demo incident memory</button>
    <pre id="console-output">Click Refresh incidents to load candidates.</pre>
    <div id="incidents-output"></div>
    <pre id="diagnosis-output" class="hidden"></pre>
    <script>
      const configuredApi = new URLSearchParams(window.location.search).get("api");
      const apiBase = configuredApi || (window.location.port === "3000" ? "http://localhost:8000" : "");
      const output = document.querySelector("#output");
      const incidentsOutput = document.querySelector("#incidents-output");
      const scenarioOutput = document.querySelector("#scenario-output");
      const consoleOutput = document.querySelector("#console-output");
      const diagnosisOutput = document.querySelector("#diagnosis-output");
      const diagnoseButton = document.querySelector("#diagnose-incident");
      const resolveButton = document.querySelector("#resolve-incident");
      const cancelButton = document.querySelector("#cancel-diagnosis");
      let loadedIncidents = [];
      let diagnosedIncident = null;

      function randomHex(bytes) {
        const values = new Uint8Array(bytes);
        crypto.getRandomValues(values);
        return [...values].map((value) => value.toString(16).padStart(2, "0")).join("");
      }

      function traceparent() {
        return `00-${randomHex(16)}-${randomHex(8)}-01`;
      }

      for (const button of document.querySelectorAll("button[data-path]")) {
        button.addEventListener("click", async () => {
          output.textContent = "Loading...";
          try {
            const response = await fetch(apiBase + button.dataset.path, {
              headers: { "traceparent": traceparent() }
            });
            const body = await response.json();
            output.textContent = JSON.stringify({ status: response.status, body }, null, 2);
          } catch (error) {
            output.textContent = `Request failed: ${error}`;
          }
        });
      }

      async function apiRequest(path, options = {}) {
        const response = await fetch(path, options);
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
        return body;
      }

      function formatTime(value) {
        if (!value) return "not available";
        return new Intl.DateTimeFormat("en-IN", { dateStyle: "medium", timeStyle: "medium", timeZone: "Asia/Kolkata", timeZoneName: "short" }).format(new Date(value));
      }

      function renderIncident(incident) {
        const card = document.createElement("section");
        card.className = `incident ${incident.status}`;
        const title = incident.title || "Unclassified incident candidate";
        card.innerHTML = `<h3>${title}</h3>
          <div class="meta"><span class="pill">${incident.severity}</span>
          ${incident.status} · observations=${incident.observation_count || 1}</div>
          <div class="meta">first detected: ${formatTime(incident.first_seen)}<br>last seen: ${formatTime(incident.last_seen)}<br>trace: ${incident.trace_reference || "none"}</div>`;
        return card;
      }

      async function refreshIncidents() {
        incidentsOutput.textContent = "Loading incidents...";
        try {
          const body = await apiRequest("/incidents/api/incidents");
          loadedIncidents = body;
          incidentsOutput.textContent = "";
          if (!body.length) { incidentsOutput.textContent = "No incidents found."; return; }
          body.forEach((incident) => incidentsOutput.appendChild(renderIncident(incident)));
          consoleOutput.textContent = `Loaded ${body.length} incidents. Select Diagnose active incident to analyze current evidence.`;
        } catch (error) {
          incidentsOutput.textContent = `Incident service unavailable: ${error}`;
        }
      }

      document.querySelector("#refresh-incidents").addEventListener("click", refreshIncidents);
      async function runScenario(path, message, followup) {
        scenarioOutput.textContent = message;
        try {
          const result = await apiRequest(path, { method: "POST" });
          scenarioOutput.textContent = JSON.stringify(result, null, 2);
          if (followup) await followup();
        } catch (error) { scenarioOutput.textContent = `Scenario failed: ${error}`; }
      }
      document.querySelector("#cause-pool").onclick = () => runScenario("/api/demo/db-pool-exhaust", "Holding all API database-pool connections...");
      document.querySelector("#cause-lock").onclick = () => runScenario("/api/demo/db-lock/start", "Holding the demo database lock...", async () => { for (let i = 0; i < 12; i++) fetch("/api/items").catch(() => null); });
      document.querySelector("#cause-retry").onclick = () => runScenario("/api/demo/dependency-failure", "Activating dependency timeout and retries...", async () => { for (let i = 0; i < 30; i++) fetch("/api/demo/downstream").catch(() => null); });
      document.querySelector("#reset-demo").onclick = () => runScenario("/api/demo/reset", "Releasing demo resources...");

      diagnoseButton.onclick = async () => {
        const active = loadedIncidents.filter((incident) => incident.status === "active");
        if (!active.length) { consoleOutput.textContent = "No active incident available for diagnosis. Click Refresh incidents after triggering a scenario."; return; }
        let selected = active[0];
        if (active.length > 1) {
          const choice = prompt(`Enter the number to diagnose:\n${active.map((item, index) => `${index + 1}. ${item.title || item.rule}`).join("\n")}`, "1");
          selected = active[Math.max(0, Math.min(active.length - 1, Number(choice || 1) - 1))];
        }
        diagnoseButton.disabled = true;
        diagnosisOutput.className = "";
        diagnosisOutput.textContent = "Collecting two minutes of metrics, logs, traces, and resolved memory...";
        try {
          diagnosedIncident = await apiRequest(`/incidents/api/incidents/${selected.id}/diagnose`, { method: "POST" });
          diagnosisOutput.textContent = JSON.stringify(diagnosedIncident, null, 2);
          resolveButton.className = "";
          cancelButton.className = "";
          consoleOutput.textContent = `Diagnosis complete using ${diagnosedIncident.diagnosis?.mode || "configured provider"}.`;
        } catch (error) { diagnosisOutput.textContent = `Diagnosis failed: ${error}`; diagnoseButton.disabled = false; }
      };
      resolveButton.onclick = async () => {
        if (!diagnosedIncident) return;
        const title = prompt("Final incident title:", diagnosedIncident.diagnosis?.probable_root_cause || "Incident");
        if (!title) return;
        const outcome = prompt("Resolution / solution:", "Released the blocked resource and restarted the affected service.");
        if (!outcome) return;
        await apiRequest(`/incidents/api/incidents/${diagnosedIncident.id}/resolve`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ title, outcome }) });
        const localIncident = loadedIncidents.find((incident) => incident.id === diagnosedIncident.id);
        if (localIncident) { localIncident.status = "resolved"; localIncident.title = title; }
        consoleOutput.textContent = "Incident resolved and saved to long-term memory. Click Refresh incidents to view the updated list.";
        cancelButton.click();
      };
      cancelButton.onclick = () => { diagnosedIncident = null; diagnosisOutput.textContent = "Diagnosis cancelled."; diagnosisOutput.className = ""; resolveButton.className = "hidden"; cancelButton.className = "hidden"; diagnoseButton.disabled = false; };
      document.querySelector("#clear-memory").onclick = async () => { if (!confirm("Delete all incident history, including resolved memory?")) return; const result = await apiRequest("/incidents/api/admin/reset-memory", { method: "POST" }); consoleOutput.textContent = `Deleted ${result.deleted_incidents} incidents. Click Refresh incidents.`; incidentsOutput.textContent = ""; loadedIncidents = []; };
    </script>
  </body>
</html>
