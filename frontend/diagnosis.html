<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnosis Report</title>
<style>:root{--ink:#172033;--muted:#667085;--line:#e5e7eb;--blue:#2563eb;--bg:#f7f9fc;--red:#b42318;--green:#18794e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}header{background:#fff;border-bottom:1px solid var(--line)}.bar,main{max-width:1040px;margin:auto;padding:0 24px}.bar{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:1.2rem;font-weight:800;color:var(--ink);text-decoration:none}main{padding-top:30px;padding-bottom:60px}.back{color:var(--blue);text-decoration:none}.head{display:flex;justify-content:space-between;gap:18px;align-items:start;margin:20px 0}.head h1{margin:0 0 8px;font-size:2rem;letter-spacing:-.03em}p{color:var(--muted);line-height:1.55;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff;font:inherit;cursor:pointer}button.primary{background:var(--blue);border-color:var(--blue);color:#fff}button.danger{color:var(--red)}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}.panel h2{font-size:1rem;margin:0 0 13px}.metric{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:9px 0}.metric:last-child{border:0}.metric small{display:block;color:var(--muted);font-size:.76rem}.good,.normal{color:var(--green)}.bad,.breached{color:var(--red)}.badge{font-size:.75rem;font-weight:700}.value{font-variant-numeric:tabular-nums}.evidence{white-space:pre-wrap;max-height:240px;overflow:auto;background:#f8fafc;border-radius:8px;padding:12px;font-size:.78rem;color:#475467}.trace{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0}.similar{border-left:3px solid #7f56d9;padding:9px 12px;margin:8px 0;background:#faf9ff}.similar strong{display:block}.empty{color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.head{display:block}.actions{margin-top:16px}.metric{grid-template-columns:1fr auto}.metric small{grid-column:1/-1}}</style></head>
<body><header><div class="bar"><a class="brand" href="/">QuickCart / Operations</a><a href="/operations">Back to console</a></div></header><main><a class="back" href="/operations">← Operations console</a><div id="app"><p style="margin-top:24px">Loading diagnosis report...</p></div></main>
<script>
const reportId=new URLSearchParams(location.search).get("report_id"),app=document.querySelector("#app");const api=async(path,options={})=>{const r=await fetch(path,options),b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.detail||`HTTP ${r.status}`);return b};const time=v=>v?new Intl.DateTimeFormat("en-IN",{dateStyle:"medium",timeStyle:"short",timeZone:"Asia/Kolkata"}).format(new Date(v)):"—";const esc=v=>String(v??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function asObject(value){if(!value)return {};if(typeof value==="string"){try{return JSON.parse(value)}catch(_){return {}}}return value}
function render(r){const d=asObject(r.diagnosis),s=asObject(r.summary),fp=asObject(r.fingerprint),evidence=asObject(r.evidence),metrics=asObject(s.metrics||evidence.metrics||{}),traces=s.traces||evidence.traces||[],matches=Array.isArray(r.similar_incidents)?r.similar_incidents:[],logs=(s.logs||evidence.logs||[]).slice(-16),pods=s.pods||[];app.innerHTML=`<section class="head"><div><h1>Diagnosis report</h1><p>Telemetry evidence · created ${time(r.created_at)}</p><p>Window: ${time(r.window_start)} — ${time(r.window_end)} · status: ${esc(r.status)}</p></div><div class="actions"><button id="close">Close diagnosis</button><button id="cancel" class="danger" ${r.status!=="open"?"disabled":""}>Cancel diagnosis</button><button id="resolve" class="primary" ${r.status!=="open"?"disabled":""}>Fix / Resolve incident</button></div></section><div class="panel"><h2>How memory works</h2><p>This report is a current telemetry snapshot. Only Resolve saves a title, resolution note, fingerprint, and evidence as future memory. Cancel, Close, and Diagnose do not save memory.</p></div><div class="grid"><section class="panel"><h2>Metrics — two-minute mean</h2><div>${Object.values(metrics).map(m=>`<div class="metric"><span>${esc(m.rule)}<small>threshold ${esc(m.comparison)} ${m.threshold} · samples ${m.sample_count}</small></span><span class="value">${m.mean===null?"—":m.mean}</span><span>vs ${m.threshold}</span><b class="badge ${String(m.status).toLowerCase()}">${esc(m.status)}</b></div>`).join("")||'<div class="empty">No configured metrics found.</div>'}</div></section><section class="panel"><h2>Signal summary</h2><p><b>Dominant signal:</b> ${esc(s.dominant_signal||fp.dominant_signal||"none")}</p><p><b>Trend:</b> ${esc(s.trend||fp.trend||"unknown")}</p><p style="margin-top:9px"><b>Possible causes from analysis</b></p><ul>${(d.possible_root_causes||[]).map(x=>`<li>${esc(x)}</li>`).join("")||"<li>No root-cause conclusion was generated. Review the evidence below.</li>"}</ul><p><b>Analysis</b></p><p>${esc(d.analysis_summary||"Telemetry evidence was collected for engineering review.")}</p><p><b>Recommended action</b></p><p>${esc(d.recommended_action||"Review the evidence and investigate the affected service or dependency.")}</p></section></div><section class="panel"><h2>Traces and bottlenecks</h2>${traces.length?traces.map(t=>`<div class="trace"><b>${esc(t.span_operation||"Unknown operation")}</b> · ${esc(t.span_service||"Unknown service")}<br><span>${t.failed?"failed · ":""}${t.duration_ms} ms · bottleneck ${t.pct_of_total_duration}% · trace ${esc(t.trace_id||"—")}</span></div>`).join(""):"<div class=\"empty\">No failed or slow traces found in this window.</div>"}</section><div class="grid"><section class="panel"><h2>Similar resolved incidents</h2>${matches.length?matches.map(m=>`<div class="similar"><strong>${esc(m.match_tier||"match")} · ${esc(m.title)}</strong><span>${esc(m.resolution_outcome)} · score ${m.similarity_score}</span></div>`).join(""):"<div class=\"empty\">No relevant resolved incident found.</div>"}</section><section class="panel"><h2>Pods and important logs</h2><p>${pods.length?pods.map(p=>`${esc(p.name)} · ${esc(p.phase)} · restarts ${p.restarts}`).join("<br>"):"Pod data unavailable"}</p><details style="margin-top:12px"><summary>Recent logs</summary><pre class="evidence">${esc(logs.join("\n"))||"No logs returned."}</pre></details></section></div>`;document.querySelector("#close").onclick=()=>location.href="/operations";document.querySelector("#cancel").onclick=async()=>{if(!confirm("Cancel this diagnosis? The report stays in history, but it will not resolve the incident or create memory."))return;try{await api(`/incidents/api/diagnosis-reports/${r.id}/cancel`,{method:"POST"});location.href="/operations"}catch(e){alert(`Cancel failed: ${e.message}`)}};document.querySelector("#resolve").onclick=async()=>{const title=prompt("Final incident title:","");if(!title)return;const outcome=prompt("Resolution note:",d.recommended_action||"");if(!outcome)return;try{await api(`/incidents/api/diagnosis-reports/${r.id}/resolve`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({title,outcome})});location.href="/operations"}catch(e){alert(`Resolve failed: ${e.message}`)}}}
(async()=>{try{if(!reportId)throw Error("Missing report_id");render(await api(`/incidents/api/diagnosis-reports/${reportId}`))}catch(e){app.innerHTML=`<section class="panel"><h2>Unable to load diagnosis report</h2><p>${esc(e.message)}</p><p style="margin-top:12px"><a class="back" href="/operations">Return to operations console</a></p></section>`}})();
</script></body></html>
