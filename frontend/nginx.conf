server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /operations {
        try_files /operations.html =404;
    }

    location = /operations/ {
        try_files /operations.html =404;
    }

    location = /operations/diagnosis {
        try_files /diagnosis.html =404;
    }

    location = /operations/diagnosis/ {
        try_files /diagnosis.html =404;
    }

    location = /health {
        proxy_pass http://incident-api:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://incident-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /incidents/ {
        proxy_pass http://incident-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
