<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QuickCart</title>
    <style>
      :root { --ink:#172033; --muted:#667085; --line:#e5e7eb; --brand:#2563eb; --soft:#f7f9fc; }
      * { box-sizing:border-box; }
      body { margin:0; font-family:system-ui,sans-serif; color:var(--ink); background:var(--soft); }
      header { background:#fff; border-bottom:1px solid var(--line); }
      .bar, main { max-width:1100px; margin:auto; padding:0 24px; }
      .bar { height:72px; display:flex; align-items:center; justify-content:space-between; }
      .brand { color:var(--ink); font-size:1.35rem; font-weight:800; text-decoration:none; }
      nav a { color:var(--muted); text-decoration:none; margin-left:22px; font-size:.95rem; }
      nav a:hover { color:var(--brand); }
      main { padding-top:42px; padding-bottom:56px; }
      .hero { display:flex; justify-content:space-between; gap:28px; align-items:end; margin-bottom:24px; }
      h1 { font-size:clamp(2rem,4vw,3.2rem); line-height:1.05; margin:0 0 12px; letter-spacing:-.04em; }
      h2 { margin:0 0 16px; font-size:1.15rem; }
      p { color:var(--muted); margin:0; line-height:1.6; }
      .search { width:min(320px,100%); padding:12px 14px; border:1px solid var(--line); border-radius:9px; font:inherit; background:#fff; }
      .layout { display:grid; grid-template-columns:1fr 310px; gap:22px; align-items:start; }
      .panel, .product { background:#fff; border:1px solid var(--line); border-radius:12px; }
      .panel { padding:20px; }
      .products { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
      .product { padding:18px; display:flex; flex-direction:column; min-height:190px; }
      .emoji { font-size:2rem; margin-bottom:18px; }
      .product h3 { margin:0 0 6px; font-size:1rem; }
      .price { font-weight:750; margin-top:auto; padding-top:16px; }
      button { border:0; border-radius:8px; background:var(--brand); color:#fff; padding:10px 13px; font:inherit; font-weight:650; cursor:pointer; }
      button:hover { background:#1d4ed8; }
      .product button, #checkout { margin-top:12px; width:100%; }
      .cart-row { display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); font-size:.94rem; }
      .cart-row small { color:var(--muted); display:block; margin-top:3px; }
      .total { display:flex; justify-content:space-between; font-weight:750; padding:18px 0; }
      #message { min-height:26px; color:#19734a; margin-top:14px; font-size:.92rem; }
      .empty { color:var(--muted); padding:14px 0; }
      @media (max-width:760px) { .hero { display:block; } .search { margin-top:18px; width:100%; } .layout { grid-template-columns:1fr; } }
    </style>
  </head>
  <body>
    <header><div class="bar"><a class="brand" href="/">QuickCart</a><nav><a href="#products">Shop</a><a href="#orders">Orders</a><a href="/operations">Operations</a></nav></div></header>
    <main>
      <section class="hero"><div><h1>Everyday essentials,<br>delivered simply.</h1><p>A small, reliable store for the things you need.</p></div><input id="search" class="search" type="search" placeholder="Search products"></section>
      <div class="layout">
        <section id="products" class="panel"><h2>Featured products</h2><div id="product-list" class="products"></div><div id="message"></div></section>
        <aside class="panel"><h2>Your cart</h2><div id="cart"></div><div class="total"><span>Total</span><span id="total">₹0</span></div><button id="checkout">Place order</button></aside>
      </div>
      <section id="orders" class="panel" style="margin-top:22px"><h2>Recent orders</h2><div id="orders-list" class="empty">No orders yet. Add something to your cart to get started.</div></section>
    </main>
    <script>
      const products = [
        { id:1, name:"Daily planner", description:"A simple notebook for focused days.", price:349, emoji:"📓" },
        { id:2, name:"Travel mug", description:"Insulated stainless steel, 350 ml.", price:799, emoji:"☕" },
        { id:3, name:"Desk lamp", description:"Warm LED light with a compact design.", price:1299, emoji:"💡" },
        { id:4, name:"Canvas tote", description:"A durable everyday carry bag.", price:499, emoji:"👜" }
      ];
      const cart = new Map(); const orders = [];
      const money = value => `₹${value.toLocaleString("en-IN")}`;
      function renderProducts(filter="") {
        const list=document.querySelector("#product-list"); list.innerHTML="";
        products.filter(p => `${p.name} ${p.description}`.toLowerCase().includes(filter.toLowerCase())).forEach(p => {
          const card=document.createElement("article"); card.className="product";
          card.innerHTML=`<div class="emoji">${p.emoji}</div><h3>${p.name}</h3><p>${p.description}</p><div class="price">${money(p.price)}</div><button data-add="${p.id}">Add to cart</button>`; list.appendChild(card);
        });
        if (!list.children.length) list.innerHTML='<p class="empty">No products found.</p>';
      }
      function renderCart() {
        const target=document.querySelector("#cart"); target.innerHTML=""; let total=0;
        if (!cart.size) target.innerHTML='<div class="empty">Your cart is empty.</div>';
        cart.forEach((quantity,id) => { const p=products.find(item=>item.id===id); total += p.price*quantity; const row=document.createElement("div"); row.className="cart-row"; row.innerHTML=`<span>${p.name}<small>Qty ${quantity}</small></span><strong>${money(p.price*quantity)}</strong>`; target.appendChild(row); });
        document.querySelector("#total").textContent=money(total);
      }
      function renderOrders() { const target=document.querySelector("#orders-list"); if (!orders.length) { target.className="empty"; target.textContent="No orders yet. Add something to your cart to get started."; return; } target.className=""; target.innerHTML=orders.map(o=>`<div class="cart-row"><span>Order ${o.id}<small>${o.items} item(s) · ${o.time}</small></span><strong>${money(o.total)}</strong></div>`).join(""); }
      document.querySelector("#product-list").addEventListener("click", e => { const id=Number(e.target.dataset.add); if (!id) return; cart.set(id,(cart.get(id)||0)+1); renderCart(); document.querySelector("#message").textContent="Added to your cart."; });
      document.querySelector("#search").addEventListener("input", e => renderProducts(e.target.value));
      document.querySelector("#checkout").addEventListener("click", async () => { if (!cart.size) { document.querySelector("#message").textContent="Add a product before checking out."; return; } const total=[...cart].reduce((sum,[id,q])=>sum+products.find(p=>p.id===id).price*q,0); const response=await fetch("/api/hello"); if (!response.ok) { document.querySelector("#message").textContent="Checkout is temporarily unavailable."; return; } orders.unshift({id:`QC-${String(orders.length+1).padStart(3,"0")}`,items:[...cart.values()].reduce((a,b)=>a+b,0),total,time:new Intl.DateTimeFormat("en-IN",{dateStyle:"medium",timeZone:"Asia/Kolkata"}).format(new Date())}); cart.clear(); renderCart(); renderOrders(); document.querySelector("#message").textContent="Order placed successfully."; });
      renderProducts(); renderCart();
    </script>
  </body>
</html>
