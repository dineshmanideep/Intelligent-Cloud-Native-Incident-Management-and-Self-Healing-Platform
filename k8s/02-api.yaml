apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-api
  namespace: incident-platform
  labels:
    monitoring: incident
    app: incident-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: incident-api
  template:
    metadata:
      labels:
        app: incident-api
    spec:
      containers:
        - name: api
          image: incident-demo-api:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: incident-api-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: incident-db-secret
                  key: DATABASE_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: incident-api
  namespace: incident-platform
  labels:
    monitoring: incident
spec:
  selector:
    app: incident-api
  sessionAffinity: ClientIP
  ports:
    - name: http
      port: 8000
      targetPort: http
