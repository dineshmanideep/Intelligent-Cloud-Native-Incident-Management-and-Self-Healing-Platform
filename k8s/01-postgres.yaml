apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: incident-postgres-data
  namespace: incident-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-postgres-init
  namespace: incident-platform
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS demo_items (
        id SERIAL PRIMARY KEY,
        name TEXT NOT NULL UNIQUE
    );

    INSERT INTO demo_items (name)
    VALUES ('first demo record'), ('second demo record')
    ON CONFLICT (name) DO NOTHING;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-postgres
  namespace: incident-platform
  labels:
    app: incident-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-postgres
  template:
    metadata:
      labels:
        app: incident-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: incident-api-config
                  key: DATABASE_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: incident-api-config
                  key: DATABASE_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: incident-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: incident-postgres-data
        - name: postgres-init
          configMap:
            name: incident-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: incident-postgres
  namespace: incident-platform
spec:
  selector:
    app: incident-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

