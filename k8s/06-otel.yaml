apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-otel-collector-config
  namespace: monitoring
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 5s
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    exporters:
      otlp/jaeger:
        endpoint: incident-jaeger:4317
        tls:
          insecure: true
      debug:
        verbosity: basic
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/jaeger, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-otel-collector
  namespace: monitoring
  labels:
    app: incident-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-otel-collector
  template:
    metadata:
      labels:
        app: incident-otel-collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.133.0
          args: ["--config=/etc/otelcol-contrib/collector.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: collector-config
              mountPath: /etc/otelcol-contrib/collector.yaml
              subPath: collector.yaml
              readOnly: true
      volumes:
        - name: collector-config
          configMap:
            name: incident-otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: incident-otel-collector
  namespace: monitoring
spec:
  selector:
    app: incident-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-jaeger-config
  namespace: monitoring
data:
  COLLECTOR_OTLP_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-jaeger
  namespace: monitoring
  labels:
    app: incident-jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-jaeger
  template:
    metadata:
      labels:
        app: incident-jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.76.0
          envFrom:
            - configMapRef:
                name: incident-jaeger-config
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: incident-jaeger
  namespace: monitoring
spec:
  selector:
    app: incident-jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: ui
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
