apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-api-config
  namespace: incident-platform
data:
  APP_NAME: incident-demo-api
  APP_ENV: kubernetes
  LOG_LEVEL: INFO
  DATABASE_HOST: incident-postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: incident_demo
  DATABASE_USER: incident_user
  DATABASE_POOL_MIN_SIZE: "1"
  DATABASE_POOL_MAX_SIZE: "8"
  DATABASE_POOL_TIMEOUT: "2"
  OTEL_SDK_DISABLED: "false"
  OTEL_SERVICE_NAME: incident-demo-api
  OTEL_EXPORTER_OTLP_ENDPOINT: http://incident-otel-collector.monitoring.svc.cluster.local.:4317
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=kubernetes
---
apiVersion: v1
kind: Secret
metadata:
  name: incident-db-secret
  namespace: incident-platform
type: Opaque
stringData:
  DATABASE_PASSWORD: incident_password
  POSTGRES_PASSWORD: incident_password
