apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-platform-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  incident-platform.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "title": "API Targets Up",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [{"expr": "sum(up{namespace=\"incident-platform\", service=\"incident-api\"})", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "red", "value": null}, {"color": "green", "value": 2}]}}, "overrides": []}
        },
        {
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "title": "API Request Rate",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [{"expr": "sum(rate(http_requests_total{namespace=\"incident-platform\"}[5m]))", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}
        },
        {
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "title": "5xx Error Rate",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [{"expr": "sum(rate(http_requests_total{namespace=\"incident-platform\", status=~\"5..\"}[5m]))", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "reqps", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "red", "value": 0.1}]}}, "overrides": []}
        },
        {
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "title": "API p95 Latency",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"incident-platform\"}[5m])))", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}
        },
        {
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "title": "API Request Rate by Status",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [{"expr": "sum by (status) (rate(http_requests_total{namespace=\"incident-platform\"}[5m]))", "legendFormat": "{{status}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}
        },
        {
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "title": "API p95 Latency",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"incident-platform\"}[5m])))", "legendFormat": "p95", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}
        },
        {
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "title": "API CPU Usage",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [{"expr": "sum by (pod) (rate(process_cpu_seconds_total{namespace=\"incident-platform\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "percentunit"}, "overrides": []}
        },
        {
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "title": "API Memory Usage",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [{"expr": "sum by (pod) (process_resident_memory_bytes{namespace=\"incident-platform\"})", "legendFormat": "{{pod}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}
        },
        {
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "title": "Ready Pods",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 20},
          "targets": [{"expr": "sum by (pod) (kube_pod_status_ready{namespace=\"incident-platform\", condition=\"true\"})", "legendFormat": "{{pod}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short", "min": 0, "max": 1}, "overrides": []}
        }
      ],
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["incident-platform", "kubernetes"],
      "templating": {"list": []},
      "time": {"from": "now-30m", "to": "now"},
      "title": "Incident Platform Overview",
      "uid": "incident-platform-overview",
      "version": 1
    }
