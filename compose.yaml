services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incident_demo
      POSTGRES_USER: incident_user
      POSTGRES_PASSWORD: incident_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_user -d incident_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

