services:
  incident-memory-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: incident_memory
      POSTGRES_USER: incident_user
      POSTGRES_PASSWORD: incident_password
    ports:
      - "5433:5432"
    volumes:
      - incident-postgres-data:/var/lib/postgresql/data
      - ./database/incident_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_user -d incident_memory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  incident-postgres-data:

